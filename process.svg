<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="How a TECSO project runs: written scope, build in your repo, weekly demo, test-gated deploy, hand-over">
<title>How a TECSO project runs: written scope, build in your repo, weekly demo, test-gated deploy, hand-over</title>
<defs>
  <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="54%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  <radialGradient id="p-o1"><stop offset="0%" stop-color="#818cf8" stop-opacity=".75"/><stop offset="60%" stop-color="#818cf8" stop-opacity=".15"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="p-o2"><stop offset="0%" stop-color="#be5bf6" stop-opacity=".6"/><stop offset="60%" stop-color="#be5bf6" stop-opacity=".13"/><stop offset="100%" stop-color="#be5bf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="p-o3"><stop offset="0%" stop-color="#5beaf6" stop-opacity=".55"/><stop offset="60%" stop-color="#5beaf6" stop-opacity=".12"/><stop offset="100%" stop-color="#5beaf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="p-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a5b4fc" stop-opacity=".15"/><stop offset="45%" stop-color="#818cf8" stop-opacity=".85"/><stop offset="100%" stop-color="#be5bf6" stop-opacity=".2"/></linearGradient>
  <linearGradient id="p-word" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="55%" stop-color="#818cf8"/><stop offset="100%" stop-color="#be5bf6"/></linearGradient>
  <linearGradient id="p-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".16"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="p-clip"><rect width="860" height="300" rx="22"/></clipPath>
</defs>
<style>
  .p-a{animation:p-fa 10s ease-in-out infinite}
  .p-b{animation:p-fb 12s ease-in-out infinite 1s}
  .p-c{animation:p-fc 14s ease-in-out infinite .5s}
  .p-float{animation:p-float 4.5s ease-in-out infinite}
  .p-bob{animation:p-bob 5s ease-in-out infinite}
  .p-pulse{animation:p-pulse 2.4s ease-in-out infinite}
  .p-sweep{animation:p-sweep 5.5s ease-in-out infinite}
  .p-wave{opacity:0;animation:p-wave 7s linear infinite}
  .p-twinkle{animation:p-twinkle 3.6s ease-in-out infinite}
  @keyframes p-fa{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
  @keyframes p-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes p-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes p-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes p-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes p-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes p-sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(1100px)}}
  @keyframes p-wave{0%{opacity:0}6%{opacity:.55}14%,100%{opacity:0}}
  @keyframes p-twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
  @media (prefers-reduced-motion:reduce){.p-a,.p-b,.p-c,.p-float,.p-bob,.p-pulse,.p-sweep,.p-wave,.p-twinkle{animation:none}}
</style>
