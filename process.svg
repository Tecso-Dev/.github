  <polygon points="481.0,146.0 497.0,134.8 497.0,202.8 481.0,214.0" fill="#48225d"/><polygon points="363.0,146.0 379.0,134.8 497.0,134.8 481.0,146.0" fill="#b456e9"/><polygon points="363.0,146.0 481.0,146.0 481.0,214.0 363.0,214.0" fill="#391b49" stroke="#be5bf6" stroke-opacity=".6"/><clipPath id="p-s2"><polygon points="363.0,146.0 481.0,146.0 481.0,214.0 363.0,214.0"/></clipPath><g clip-path="url(#p-s2)"><rect class="p-sweep" style="animation-delay:0.6s" x="243.0" y="146" width="110" height="68" fill="url(#p-sweep)"/></g><text x="375.0" y="168.0" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#e0e7ff">03</text><text x="422.0" y="240" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e0e7ff">Weekly demo</text><text x="422.0" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">staging + short report</text>
  <polygon points="639.0,129.0 655.0,117.8 655.0,202.8 639.0,214.0" fill="#22585d"/><polygon points="521.0,129.0 537.0,117.8 655.0,117.8 639.0,129.0" fill="#56dee9"/><polygon points="521.0,129.0 639.0,129.0 639.0,214.0 521.0,214.0" fill="#1b4649" stroke="#5beaf6" stroke-opacity=".6"/><clipPath id="p-s3"><polygon points="521.0,129.0 639.0,129.0 639.0,214.0 521.0,214.0"/></clipPath><g clip-path="url(#p-s3)"><rect class="p-sweep" style="animation-delay:0.9s" x="401.0" y="129" width="110" height="85" fill="url(#p-sweep)"/></g><text x="533.0" y="151.0" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#e0e7ff">04</text><text x="580.0" y="240" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e0e7ff">Test-gated deploy</text><text x="580.0" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">CI, rollback, backups</text>
