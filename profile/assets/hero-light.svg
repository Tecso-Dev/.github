<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="TECSO — software and infrastructure studio, Urmia, Iran, since 2018">
<title>TECSO — software and infrastructure studio, Urmia, Iran, since 2018</title>
<defs>
  <linearGradient id="thl-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="54%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <radialGradient id="thl-o1"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".75"/><stop offset="60%" stop-color="#4f46e5" stop-opacity=".16"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
  <radialGradient id="thl-o2"><stop offset="0%" stop-color="#9333ea" stop-opacity=".6"/><stop offset="60%" stop-color="#9333ea" stop-opacity=".14"/><stop offset="100%" stop-color="#9333ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="thl-o3"><stop offset="0%" stop-color="#0891b2" stop-opacity=".6"/><stop offset="60%" stop-color="#0891b2" stop-opacity=".14"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <linearGradient id="thl-shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366f1" stop-opacity=".15"/><stop offset="45%" stop-color="#6366f1" stop-opacity=".85"/><stop offset="100%" stop-color="#9333ea" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="thl-word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1e1b4b"/><stop offset="55%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#9333ea"/>
  </linearGradient>
  <clipPath id="thl-clip"><rect width="860" height="320" rx="22"/></clipPath>
</defs>
<style>
  .thl-a{animation:thl-fa 10s ease-in-out infinite}
  .thl-b{animation:thl-fb 12s ease-in-out infinite 1s}
  .thl-c{animation:thl-fc 14s ease-in-out infinite .5s}
  .thl-spin{animation:thl-spin 40s linear infinite;transform-box:view-box}
  .thl-flow{animation:thl-flow 3s linear infinite}
  .thl-pulse{animation:thl-pulse 3.2s ease-in-out infinite}
  @keyframes thl-fa{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
  @keyframes thl-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes thl-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes thl-spin{to{transform:rotate(360deg)}}
  @keyframes thl-flow{to{stroke-dashoffset:-24}}
  @keyframes thl-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.thl-a,.thl-b,.thl-c,.thl-spin,.thl-flow,.thl-pulse{animation:none}}
</style>
<g clip-path="url(#thl-clip)">
