  <text x="44" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#64748b">TECSO · SOFTWARE &amp; INFRASTRUCTURE STUDIO</text>
  <circle class="thl-pulse" cx="568" cy="48" r="3.5" fill="#22c55e"/>
  <text x="580" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#64748b">TAKING PROJECTS</text>
  <text x="40" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#thl-word)">TECSO</text>
  <text x="44" y="176" font-family="Vazirmatn,Tahoma,'Segoe UI','Noto Sans Arabic',sans-serif" font-size="20" font-weight="600" fill="#334155">راهکارپرداز فن‌آوران هوشمند</text>
  <text x="44" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15" fill="#334155">Enterprise web, applied AI, DevOps and networks —</text>
  <text x="44" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15" fill="#334155">designed, built and handed over end-to-end. Urmia, Iran · since 2018.</text>
  <g><rect x="44.0" y="252" width="98.5" height="28" rx="14" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".35"/><text x="93.2" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#3730a3">Vue · Nuxt</text></g><g><rect x="150.5" y="252" width="40.5" height="28" rx="14" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".35"/><text x="170.8" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#3730a3">Go</text></g><g><rect x="199.0" y="252" width="142.0" height="28" rx="14" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".35"/><text x="270.0" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#3730a3">Python · FastAPI</text></g><g><rect x="349.0" y="252" width="98.5" height="28" rx="14" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".35"/><text x="398.2" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#3730a3">PostgreSQL</text></g><g><rect x="455.5" y="252" width="98.5" height="28" rx="14" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".35"/><text x="504.8" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#3730a3">Kubernetes</text></g><g><rect x="562.0" y="252" width="98.5" height="28" rx="14" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".35"/><text x="611.2" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#3730a3">LLM agents</text></g>
  </g>
  <g>
    <circle cx="718" cy="152" r="122" fill="none" stroke="#4f46e5" stroke-opacity=".12"/>
    <circle cx="718" cy="152" r="96" fill="none" stroke="#4f46e5" stroke-opacity=".28"/>
    <g class="thl-spin" style="transform-origin:718px 152px"><circle cx="718" cy="152" r="70" fill="none" stroke="#9333ea" stroke-opacity=".55" stroke-dasharray="3 9"/>
      <circle cx="788" cy="152" r="3.5" fill="#9333ea"/><circle cx="648" cy="152" r="2.5" fill="#0891b2"/></g>
    <circle cx="718" cy="152" r="40" fill="#4f46e5" fill-opacity=".1" stroke="#4f46e5" stroke-opacity=".6"/>
    <text x="718" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="url(#thl-word)">&lt;/&gt;</text>
    <circle cx="634.9" cy="104.0" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-opacity=".7"/><text x="634.9" y="108.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#3730a3">web</text><circle cx="791.5" cy="90.3" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-opacity=".7"/><text x="791.5" y="94.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#3730a3">ai</text><circle cx="766.0" cy="235.1" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-opacity=".7"/><text x="766.0" y="239.1" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#3730a3">ops</text><circle cx="631.0" cy="192.6" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-opacity=".7"/><text x="631.0" y="196.6" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#3730a3">net</text>
  </g>
