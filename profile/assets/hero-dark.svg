<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="TECSO — software and infrastructure studio, Urmia, Iran, since 2018">
<title>TECSO — software and infrastructure studio, Urmia, Iran, since 2018</title>
<defs>
  <linearGradient id="thd-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/><stop offset="54%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <radialGradient id="thd-o1"><stop offset="0%" stop-color="#818cf8" stop-opacity=".75"/><stop offset="60%" stop-color="#818cf8" stop-opacity=".16"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="thd-o2"><stop offset="0%" stop-color="#be5bf6" stop-opacity=".6"/><stop offset="60%" stop-color="#be5bf6" stop-opacity=".14"/><stop offset="100%" stop-color="#be5bf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="thd-o3"><stop offset="0%" stop-color="#5beaf6" stop-opacity=".6"/><stop offset="60%" stop-color="#5beaf6" stop-opacity=".14"/><stop offset="100%" stop-color="#5beaf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="thd-shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a5b4fc" stop-opacity=".15"/><stop offset="45%" stop-color="#818cf8" stop-opacity=".85"/><stop offset="100%" stop-color="#be5bf6" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="thd-word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e0e7ff"/><stop offset="55%" stop-color="#818cf8"/><stop offset="100%" stop-color="#be5bf6"/>
  </linearGradient>
  <clipPath id="thd-clip"><rect width="860" height="320" rx="22"/></clipPath>
</defs>
<style>
  .thd-a{animation:thd-fa 10s ease-in-out infinite}
  .thd-b{animation:thd-fb 12s ease-in-out infinite 1s}
  .thd-c{animation:thd-fc 14s ease-in-out infinite .5s}
  .thd-spin{animation:thd-spin 40s linear infinite;transform-box:view-box}
  .thd-flow{animation:thd-flow 3s linear infinite}
  .thd-pulse{animation:thd-pulse 3.2s ease-in-out infinite}
  @keyframes thd-fa{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
  @keyframes thd-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes thd-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes thd-spin{to{transform:rotate(360deg)}}
  @keyframes thd-flow{to{stroke-dashoffset:-24}}
  @keyframes thd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.thd-a,.thd-b,.thd-c,.thd-spin,.thd-flow,.thd-pulse{animation:none}}
</style>
<g clip-path="url(#thd-clip)">
  <rect width="860" height="320" fill="url(#thd-bg)"/>
  <g opacity=".55">
    <circle class="thd-a" cx="705" cy="58" r="198" fill="url(#thd-o1)"/>
    <circle class="thd-b" cx="103" cy="304" r="176" fill="url(#thd-o2)"/>
    <circle class="thd-c" cx="834" cy="294" r="134" fill="url(#thd-o3)"/>
  </g>
  <rect x="16" y="16" width="828" height="288" rx="18" fill="#ffffff" fill-opacity=".035" stroke="url(#thd-shine)" stroke-width="1.2"/>
  <g class="thd-in">
  <text x="44" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#94a3b8">TECSO · SOFTWARE &amp; INFRASTRUCTURE STUDIO</text>
  <circle class="thd-pulse" cx="568" cy="48" r="3.5" fill="#22c55e"/>
  <text x="580" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#94a3b8">TAKING PROJECTS</text>
  <text x="40" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#thd-word)">TECSO</text>
  <text x="44" y="176" font-family="Vazirmatn,Tahoma,'Segoe UI','Noto Sans Arabic',sans-serif" font-size="20" font-weight="600" fill="#cbd5e1">راهکارپرداز فن‌آوران هوشمند</text>
  <text x="44" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15" fill="#cbd5e1">Enterprise web, applied AI, DevOps and networks —</text>
  <text x="44" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15" fill="#cbd5e1">designed, built and handed over end-to-end. Urmia, Iran · since 2018.</text>
  <g><rect x="44.0" y="252" width="98.5" height="28" rx="14" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".35"/><text x="93.2" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#c7d2fe">Vue · Nuxt</text></g><g><rect x="150.5" y="252" width="40.5" height="28" rx="14" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".35"/><text x="170.8" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#c7d2fe">Go</text></g><g><rect x="199.0" y="252" width="142.0" height="28" rx="14" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".35"/><text x="270.0" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#c7d2fe">Python · FastAPI</text></g><g><rect x="349.0" y="252" width="98.5" height="28" rx="14" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".35"/><text x="398.2" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#c7d2fe">PostgreSQL</text></g><g><rect x="455.5" y="252" width="98.5" height="28" rx="14" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".35"/><text x="504.8" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#c7d2fe">Kubernetes</text></g><g><rect x="562.0" y="252" width="98.5" height="28" rx="14" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".35"/><text x="611.2" y="270.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#c7d2fe">LLM agents</text></g>
  </g>
  <g>
    <circle cx="718" cy="152" r="122" fill="none" stroke="#818cf8" stroke-opacity=".12"/>
    <circle cx="718" cy="152" r="96" fill="none" stroke="#818cf8" stroke-opacity=".28"/>
    <g class="thd-spin" style="transform-origin:718px 152px"><circle cx="718" cy="152" r="70" fill="none" stroke="#be5bf6" stroke-opacity=".55" stroke-dasharray="3 9"/>
      <circle cx="788" cy="152" r="3.5" fill="#be5bf6"/><circle cx="648" cy="152" r="2.5" fill="#5beaf6"/></g>
    <circle cx="718" cy="152" r="40" fill="#818cf8" fill-opacity=".1" stroke="#818cf8" stroke-opacity=".6"/>
    <text x="718" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="url(#thd-word)">&lt;/&gt;</text>
    <circle cx="634.9" cy="104.0" r="15" fill="#0f172a" stroke="#818cf8" stroke-opacity=".7"/><text x="634.9" y="108.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#c7d2fe">web</text><circle cx="791.5" cy="90.3" r="15" fill="#0f172a" stroke="#818cf8" stroke-opacity=".7"/><text x="791.5" y="94.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#c7d2fe">ai</text><circle cx="766.0" cy="235.1" r="15" fill="#0f172a" stroke="#818cf8" stroke-opacity=".7"/><text x="766.0" y="239.1" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#c7d2fe">ops</text><circle cx="631.0" cy="192.6" r="15" fill="#0f172a" stroke="#818cf8" stroke-opacity=".7"/><text x="631.0" y="196.6" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#c7d2fe">net</text>
  </g>
</g>
<rect x=".5" y=".5" width="859" height="319" rx="21.5" fill="none" stroke="#818cf8" stroke-opacity=".35"/>
</svg>
