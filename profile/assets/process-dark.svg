<svg xmlns="http://www.w3.org/2000/svg" width="860" height="232" viewBox="0 0 860 232" role="img" aria-label="How a TECSO project runs: written scope, build in your repo, weekly demo, test-gated deploy, hand-over">
<title>How a TECSO project runs: written scope, build in your repo, weekly demo, test-gated deploy, hand-over</title>
<defs>
  <linearGradient id="tpd-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/><stop offset="54%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <radialGradient id="tpd-o1"><stop offset="0%" stop-color="#818cf8" stop-opacity=".75"/><stop offset="60%" stop-color="#818cf8" stop-opacity=".16"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="tpd-o2"><stop offset="0%" stop-color="#be5bf6" stop-opacity=".6"/><stop offset="60%" stop-color="#be5bf6" stop-opacity=".14"/><stop offset="100%" stop-color="#be5bf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="tpd-o3"><stop offset="0%" stop-color="#5beaf6" stop-opacity=".6"/><stop offset="60%" stop-color="#5beaf6" stop-opacity=".14"/><stop offset="100%" stop-color="#5beaf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="tpd-shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a5b4fc" stop-opacity=".15"/><stop offset="45%" stop-color="#818cf8" stop-opacity=".85"/><stop offset="100%" stop-color="#be5bf6" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="tpd-word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e0e7ff"/><stop offset="55%" stop-color="#818cf8"/><stop offset="100%" stop-color="#be5bf6"/>
  </linearGradient>
  <clipPath id="tpd-clip"><rect width="860" height="232" rx="22"/></clipPath>
</defs>
<style>
  .tpd-a{animation:tpd-fa 10s ease-in-out infinite}
  .tpd-b{animation:tpd-fb 12s ease-in-out infinite 1s}
  .tpd-c{animation:tpd-fc 14s ease-in-out infinite .5s}
  .tpd-spin{animation:tpd-spin 40s linear infinite;transform-box:view-box}
  .tpd-flow{animation:tpd-flow 3s linear infinite}
  .tpd-pulse{animation:tpd-pulse 3.2s ease-in-out infinite}
  @keyframes tpd-fa{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
  @keyframes tpd-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes tpd-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes tpd-spin{to{transform:rotate(360deg)}}
  @keyframes tpd-flow{to{stroke-dashoffset:-24}}
  @keyframes tpd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.tpd-a,.tpd-b,.tpd-c,.tpd-spin,.tpd-flow,.tpd-pulse{animation:none}}
</style>
<g clip-path="url(#tpd-clip)">
  <rect width="860" height="232" fill="url(#tpd-bg)"/>
  <g opacity=".55">
    <circle class="tpd-a" cx="705" cy="42" r="144" fill="url(#tpd-o1)"/>
    <circle class="tpd-b" cx="103" cy="220" r="128" fill="url(#tpd-o2)"/>
    <circle class="tpd-c" cx="834" cy="213" r="97" fill="url(#tpd-o3)"/>
  </g>
  <rect x="16" y="16" width="828" height="200" rx="18" fill="#ffffff" fill-opacity=".035" stroke="url(#tpd-shine)" stroke-width="1.2"/>
  <text x="44" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#94a3b8">HOW A PROJECT RUNS</text>
  <text x="44" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e0e7ff">From a written scope to a clean hand-over</text>
  <line x1="102" y1="128" x2="758" y2="128" stroke="#818cf8" stroke-opacity=".25" stroke-width="2"/>
  <line class="tpd-flow" x1="102" y1="128" x2="758" y2="128" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 8"/>
  <g class="tpd-in" style="animation-delay:0.00s"><circle cx="102" cy="128" r="19" fill="#0f172a" stroke="#818cf8" stroke-width="1.6"/><text x="102" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#818cf8">01</text><text x="102" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e0e7ff">Written scope</text><text x="102" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">estimate + SRS, signed</text></g>
  <g class="tpd-in" style="animation-delay:0.15s"><circle cx="266" cy="128" r="19" fill="#0f172a" stroke="#a5b4fc" stroke-width="1.6"/><text x="266" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#a5b4fc">02</text><text x="266" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e0e7ff">Build in your repo</text><text x="266" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">your Git from day one</text></g>
  <g class="tpd-in" style="animation-delay:0.30s"><circle cx="430" cy="128" r="19" fill="#0f172a" stroke="#be5bf6" stroke-width="1.6"/><text x="430" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#be5bf6">03</text><text x="430" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e0e7ff">Weekly demo</text><text x="430" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">staging + short report</text></g>
  <g class="tpd-in" style="animation-delay:0.45s"><circle cx="594" cy="128" r="19" fill="#0f172a" stroke="#5beaf6" stroke-width="1.6"/><text x="594" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#5beaf6">04</text><text x="594" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e0e7ff">Test-gated deploy</text><text x="594" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">CI, rollback, backups</text></g>
  <g class="tpd-in" style="animation-delay:0.60s"><circle cx="758" cy="128" r="19" fill="#0f172a" stroke="#818cf8" stroke-width="1.6"/><text x="758" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#818cf8">05</text><text x="758" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e0e7ff">Hand-over</text><text x="758" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">code, docs, access</text></g>
</g>
<rect x=".5" y=".5" width="859" height="231" rx="21.5" fill="none" stroke="#818cf8" stroke-opacity=".35"/>
</svg>
