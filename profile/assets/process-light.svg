<svg xmlns="http://www.w3.org/2000/svg" width="860" height="232" viewBox="0 0 860 232" role="img" aria-label="How a TECSO project runs: written scope, build in your repo, weekly demo, test-gated deploy, hand-over">
<title>How a TECSO project runs: written scope, build in your repo, weekly demo, test-gated deploy, hand-over</title>
<defs>
  <linearGradient id="tpl-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="54%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <radialGradient id="tpl-o1"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".75"/><stop offset="60%" stop-color="#4f46e5" stop-opacity=".16"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
  <radialGradient id="tpl-o2"><stop offset="0%" stop-color="#9333ea" stop-opacity=".6"/><stop offset="60%" stop-color="#9333ea" stop-opacity=".14"/><stop offset="100%" stop-color="#9333ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="tpl-o3"><stop offset="0%" stop-color="#0891b2" stop-opacity=".6"/><stop offset="60%" stop-color="#0891b2" stop-opacity=".14"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <linearGradient id="tpl-shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366f1" stop-opacity=".15"/><stop offset="45%" stop-color="#6366f1" stop-opacity=".85"/><stop offset="100%" stop-color="#9333ea" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="tpl-word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1e1b4b"/><stop offset="55%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#9333ea"/>
  </linearGradient>
  <clipPath id="tpl-clip"><rect width="860" height="232" rx="22"/></clipPath>
</defs>
<style>
  .tpl-a{animation:tpl-fa 10s ease-in-out infinite}
  .tpl-b{animation:tpl-fb 12s ease-in-out infinite 1s}
  .tpl-c{animation:tpl-fc 14s ease-in-out infinite .5s}
  .tpl-spin{animation:tpl-spin 40s linear infinite;transform-box:view-box}
  .tpl-flow{animation:tpl-flow 3s linear infinite}
  .tpl-pulse{animation:tpl-pulse 3.2s ease-in-out infinite}
  @keyframes tpl-fa{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
  @keyframes tpl-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes tpl-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes tpl-spin{to{transform:rotate(360deg)}}
  @keyframes tpl-flow{to{stroke-dashoffset:-24}}
  @keyframes tpl-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.tpl-a,.tpl-b,.tpl-c,.tpl-spin,.tpl-flow,.tpl-pulse{animation:none}}
</style>
<g clip-path="url(#tpl-clip)">
  <rect width="860" height="232" fill="url(#tpl-bg)"/>
  <g opacity=".22">
    <circle class="tpl-a" cx="705" cy="42" r="144" fill="url(#tpl-o1)"/>
    <circle class="tpl-b" cx="103" cy="220" r="128" fill="url(#tpl-o2)"/>
    <circle class="tpl-c" cx="834" cy="213" r="97" fill="url(#tpl-o3)"/>
  </g>
  <rect x="16" y="16" width="828" height="200" rx="18" fill="#ffffff" fill-opacity=".7" stroke="url(#tpl-shine)" stroke-width="1.2"/>
  <text x="44" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#64748b">HOW A PROJECT RUNS</text>
  <text x="44" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">From a written scope to a clean hand-over</text>
  <line x1="102" y1="128" x2="758" y2="128" stroke="#4f46e5" stroke-opacity=".25" stroke-width="2"/>
  <line class="tpl-flow" x1="102" y1="128" x2="758" y2="128" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 8"/>
  <g class="tpl-in" style="animation-delay:0.00s"><circle cx="102" cy="128" r="19" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/><text x="102" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#4f46e5">01</text><text x="102" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Written scope</text><text x="102" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">estimate + SRS, signed</text></g>
  <g class="tpl-in" style="animation-delay:0.15s"><circle cx="266" cy="128" r="19" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="266" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#6366f1">02</text><text x="266" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Build in your repo</text><text x="266" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">your Git from day one</text></g>
  <g class="tpl-in" style="animation-delay:0.30s"><circle cx="430" cy="128" r="19" fill="#eef2ff" stroke="#9333ea" stroke-width="1.6"/><text x="430" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#9333ea">03</text><text x="430" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Weekly demo</text><text x="430" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">staging + short report</text></g>
  <g class="tpl-in" style="animation-delay:0.45s"><circle cx="594" cy="128" r="19" fill="#eef2ff" stroke="#0891b2" stroke-width="1.6"/><text x="594" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0891b2">04</text><text x="594" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Test-gated deploy</text><text x="594" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">CI, rollback, backups</text></g>
  <g class="tpl-in" style="animation-delay:0.60s"><circle cx="758" cy="128" r="19" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/><text x="758" y="132.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#4f46e5">05</text><text x="758" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Hand-over</text><text x="758" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">code, docs, access</text></g>
</g>
<rect x=".5" y=".5" width="859" height="231" rx="21.5" fill="none" stroke="#6366f1" stroke-opacity=".28"/>
</svg>
