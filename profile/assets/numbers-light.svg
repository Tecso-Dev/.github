<svg xmlns="http://www.w3.org/2000/svg" width="860" height="156" viewBox="0 0 860 156" role="img" aria-label="TECSO at a glance: founded 2018, 6 service lines, FA/EN RTL-native, full code ownership">
<title>TECSO at a glance: founded 2018, 6 service lines, FA/EN RTL-native, full code ownership</title>
<defs>
  <linearGradient id="tnl-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="54%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <radialGradient id="tnl-o1"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".75"/><stop offset="60%" stop-color="#4f46e5" stop-opacity=".16"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
  <radialGradient id="tnl-o2"><stop offset="0%" stop-color="#9333ea" stop-opacity=".6"/><stop offset="60%" stop-color="#9333ea" stop-opacity=".14"/><stop offset="100%" stop-color="#9333ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="tnl-o3"><stop offset="0%" stop-color="#0891b2" stop-opacity=".6"/><stop offset="60%" stop-color="#0891b2" stop-opacity=".14"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <linearGradient id="tnl-shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366f1" stop-opacity=".15"/><stop offset="45%" stop-color="#6366f1" stop-opacity=".85"/><stop offset="100%" stop-color="#9333ea" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="tnl-word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1e1b4b"/><stop offset="55%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#9333ea"/>
  </linearGradient>
  <clipPath id="tnl-clip"><rect width="860" height="156" rx="22"/></clipPath>
</defs>
<style>
  .tnl-a{animation:tnl-fa 10s ease-in-out infinite}
  .tnl-b{animation:tnl-fb 12s ease-in-out infinite 1s}
  .tnl-c{animation:tnl-fc 14s ease-in-out infinite .5s}
  .tnl-spin{animation:tnl-spin 40s linear infinite;transform-box:view-box}
  .tnl-flow{animation:tnl-flow 3s linear infinite}
  .tnl-pulse{animation:tnl-pulse 3.2s ease-in-out infinite}
  @keyframes tnl-fa{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
  @keyframes tnl-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes tnl-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes tnl-spin{to{transform:rotate(360deg)}}
  @keyframes tnl-flow{to{stroke-dashoffset:-24}}
  @keyframes tnl-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.tnl-a,.tnl-b,.tnl-c,.tnl-spin,.tnl-flow,.tnl-pulse{animation:none}}
</style>
<g clip-path="url(#tnl-clip)">
  <rect width="860" height="156" fill="url(#tnl-bg)"/>
  <g opacity=".22">
    <circle class="tnl-a" cx="705" cy="28" r="97" fill="url(#tnl-o1)"/>
    <circle class="tnl-b" cx="103" cy="148" r="86" fill="url(#tnl-o2)"/>
    <circle class="tnl-c" cx="834" cy="144" r="66" fill="url(#tnl-o3)"/>
  </g>
  <rect x="16" y="16" width="828" height="124" rx="18" fill="#ffffff" fill-opacity=".7" stroke="url(#tnl-shine)" stroke-width="1.2"/>
  <g class="tnl-in" style="animation-delay:0.00s"><rect x="34" y="32" width="188" height="92" rx="12" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".25"/><text x="50" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#64748b">FOUNDED</text><text x="49" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#4f46e5">2018</text><text x="50" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">Urmia, Iran · remote-first</text></g>
  <g class="tnl-in" style="animation-delay:0.12s"><rect x="234" y="32" width="188" height="92" rx="12" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".25"/><text x="250" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#64748b">SERVICE LINES</text><text x="249" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#9333ea">6</text><text x="250" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">web · AI · data · ops · net · UX</text></g>
  <g class="tnl-in" style="animation-delay:0.24s"><rect x="434" y="32" width="188" height="92" rx="12" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".25"/><text x="450" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#64748b">LANGUAGES</text><text x="449" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#0891b2">FA / EN</text><text x="450" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">RTL-native Persian products</text></g>
  <g class="tnl-in" style="animation-delay:0.36s"><rect x="634" y="32" width="188" height="92" rx="12" fill="#6366f1" fill-opacity=".09" stroke="#6366f1" stroke-opacity=".25"/><text x="650" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#64748b">CODE OWNERSHIP</text><text x="649" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#6366f1">100%</text><text x="650" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">your repo, no vendor lock-in</text></g>
</g>
<rect x=".5" y=".5" width="859" height="155" rx="21.5" fill="none" stroke="#6366f1" stroke-opacity=".28"/>
</svg>
