<svg xmlns="http://www.w3.org/2000/svg" width="860" height="156" viewBox="0 0 860 156" role="img" aria-label="TECSO at a glance: founded 2018, 6 service lines, FA/EN RTL-native, full code ownership">
<title>TECSO at a glance: founded 2018, 6 service lines, FA/EN RTL-native, full code ownership</title>
<defs>
  <linearGradient id="tnd-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/><stop offset="54%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <radialGradient id="tnd-o1"><stop offset="0%" stop-color="#818cf8" stop-opacity=".75"/><stop offset="60%" stop-color="#818cf8" stop-opacity=".16"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="tnd-o2"><stop offset="0%" stop-color="#be5bf6" stop-opacity=".6"/><stop offset="60%" stop-color="#be5bf6" stop-opacity=".14"/><stop offset="100%" stop-color="#be5bf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="tnd-o3"><stop offset="0%" stop-color="#5beaf6" stop-opacity=".6"/><stop offset="60%" stop-color="#5beaf6" stop-opacity=".14"/><stop offset="100%" stop-color="#5beaf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="tnd-shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a5b4fc" stop-opacity=".15"/><stop offset="45%" stop-color="#818cf8" stop-opacity=".85"/><stop offset="100%" stop-color="#be5bf6" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="tnd-word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e0e7ff"/><stop offset="55%" stop-color="#818cf8"/><stop offset="100%" stop-color="#be5bf6"/>
  </linearGradient>
  <clipPath id="tnd-clip"><rect width="860" height="156" rx="22"/></clipPath>
</defs>
<style>
  .tnd-a{animation:tnd-fa 10s ease-in-out infinite}
  .tnd-b{animation:tnd-fb 12s ease-in-out infinite 1s}
  .tnd-c{animation:tnd-fc 14s ease-in-out infinite .5s}
  .tnd-spin{animation:tnd-spin 40s linear infinite;transform-box:view-box}
  .tnd-flow{animation:tnd-flow 3s linear infinite}
  .tnd-pulse{animation:tnd-pulse 3.2s ease-in-out infinite}
  @keyframes tnd-fa{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
  @keyframes tnd-fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
  @keyframes tnd-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
  @keyframes tnd-spin{to{transform:rotate(360deg)}}
  @keyframes tnd-flow{to{stroke-dashoffset:-24}}
  @keyframes tnd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.tnd-a,.tnd-b,.tnd-c,.tnd-spin,.tnd-flow,.tnd-pulse{animation:none}}
</style>
<g clip-path="url(#tnd-clip)">
  <rect width="860" height="156" fill="url(#tnd-bg)"/>
  <g opacity=".55">
    <circle class="tnd-a" cx="705" cy="28" r="97" fill="url(#tnd-o1)"/>
    <circle class="tnd-b" cx="103" cy="148" r="86" fill="url(#tnd-o2)"/>
    <circle class="tnd-c" cx="834" cy="144" r="66" fill="url(#tnd-o3)"/>
  </g>
  <rect x="16" y="16" width="828" height="124" rx="18" fill="#ffffff" fill-opacity=".035" stroke="url(#tnd-shine)" stroke-width="1.2"/>
  <g class="tnd-in" style="animation-delay:0.00s"><rect x="34" y="32" width="188" height="92" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".25"/><text x="50" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#94a3b8">FOUNDED</text><text x="49" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#818cf8">2018</text><text x="50" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#cbd5e1">Urmia, Iran · remote-first</text></g>
  <g class="tnd-in" style="animation-delay:0.12s"><rect x="234" y="32" width="188" height="92" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".25"/><text x="250" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#94a3b8">SERVICE LINES</text><text x="249" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#be5bf6">6</text><text x="250" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#cbd5e1">web · AI · data · ops · net · UX</text></g>
  <g class="tnd-in" style="animation-delay:0.24s"><rect x="434" y="32" width="188" height="92" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".25"/><text x="450" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#94a3b8">LANGUAGES</text><text x="449" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#5beaf6">FA / EN</text><text x="450" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#cbd5e1">RTL-native Persian products</text></g>
  <g class="tnd-in" style="animation-delay:0.36s"><rect x="634" y="32" width="188" height="92" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".25"/><text x="650" y="54" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#94a3b8">CODE OWNERSHIP</text><text x="649" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#a5b4fc">100%</text><text x="650" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="11.5" fill="#cbd5e1">your repo, no vendor lock-in</text></g>
</g>
<rect x=".5" y=".5" width="859" height="155" rx="21.5" fill="none" stroke="#818cf8" stroke-opacity=".35"/>
</svg>
